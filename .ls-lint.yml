ls:
  .dir: kebab-case
  .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README | regex:AGENTS

  # Source and canon modules are camelCase, matching balebase.
  src:
    .ts: camelCase
    .test.ts: camelCase

  canon:
    .ts: camelCase

  scripts:
    .ts: camelCase
    .sh: camelCase

  # Generated outputs are kebab-case: Balebase shows these file names to
  # people as attachment and document names.
  genesis:
    .*: kebab-case

  # Image files are named after the canon IDs they depict.
  assets/portraits:
    .*: kebab-case

  assets/photos:
    .*: kebab-case

ignore:
  - .git
  - ".*"
  - "*/.*"
  - "*/*/.*"
  - node_modules
  - dist
